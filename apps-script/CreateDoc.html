<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 48px 16px;
        background: #faf8f4;
        color: #444054;
        font: 16px/1.5 Arvo, Georgia, serif;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #e6e4ea;
        border-radius: 8px;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6e6b7c;
      }
      h1 { margin: 0 0 12px; font-size: 20px; }
      p { margin: 0 0 16px; }
      .button {
        display: inline-block;
        min-height: 44px;
        padding: 10px 16px;
        box-sizing: border-box;
        border-radius: 6px;
        background: #007fff;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .danger { background: #d62246; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
      .error { color: #d62246; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">VolSoc Master Plan</p>

      <div id="confirm" hidden>
        <h1 id="confirm-title"></h1>
        <p id="confirm-text"></p>
        <button id="confirm-button" class="button danger" type="button"></button>
      </div>

      <div id="working">
        <h1 id="working-title"></h1>
        <p id="working-text"></p>
      </div>

      <div id="done" hidden>
        <h1 id="done-title"></h1>
        <p id="done-text"></p>
        <a id="open" class="button" href="#"></a>
      </div>

      <div id="failed" hidden>
        <h1 id="failed-title"></h1>
        <p id="message" class="error"></p>
      </div>
    </main>

    <script>
      const rowId = <?= rowId ?>;
      const action = <?= action ?>;

      // redirect: jump straight to what was made. Deletions stay on this page
      // so the confirmation is seen, with a button back to the sheet.
      const copy = {
        doc: {
          working: 'Creating doc…',
          detail: 'Filling it in from the sheet. This takes a few seconds.',
          done: 'Doc created',
          existed: 'This row already has a doc',
          text: "It's linked in the Doc Detail cell for this row.",
          open: 'Open doc',
          failed: "Couldn't create the doc",
          redirect: true,
        },
        calendar: {
          working: 'Adding to calendar…',
          detail: 'Filling it in from the sheet. This takes a few seconds.',
          done: 'Added as provisional',
          existed: 'Already in the calendar',
          text: 'It\'s in the VolSoc calendar as "[Provisional] …" and follows the sheet. To take it out, click the ✕ beside it in the sheet.',
          open: 'Open event',
          failed: "Couldn't add it to the calendar",
          redirect: true,
        },
        deleteDoc: {
          ask: 'Delete this doc?',
          askText: 'It goes to the Drive trash, where it can be restored for 30 days. The row in the sheet gets a Create doc button again.',
          confirm: 'Delete doc',
          working: 'Deleting doc…',
          detail: 'Moving it to the Drive trash.',
          done: 'Doc deleted',
          existed: 'This row has no doc',
          text: 'It can be restored from the Drive trash for 30 days. The row has a Create doc button again.',
          open: 'Back to the sheet',
          failed: "Couldn't delete the doc",
        },
        removeCalendar: {
          ask: 'Remove from the VolSoc calendar?',
          askText: 'The calendar event for this row is deleted. The row in the sheet gets an Add to calendar button again.',
          confirm: 'Remove event',
          working: 'Removing from calendar…',
          detail: 'Deleting the VolSoc calendar event.',
          done: 'Removed from the calendar',
          existed: "This row isn't in the calendar",
          text: 'The row has an Add to calendar button again.',
          open: 'Back to the sheet',
          failed: "Couldn't remove the event",
        },
      }[action];

      const setText = (id, text) => (document.getElementById(id).textContent = text);
      setText('working-title', copy.working);
      setText('working-text', copy.detail);
      setText('done-text', copy.text);
      setText('open', copy.open);
      setText('failed-title', copy.failed);

      function show(id) {
        ['confirm', 'working', 'done', 'failed'].forEach((section) => {
          document.getElementById(section).hidden = section !== id;
        });
      }

      // Deleting asks first, so a stray click on the link in the doc does nothing.
      function run() {
        show('working');
        google.script.run
          .withSuccessHandler((result) => {
            setText('done-title', result.existed ? copy.existed : copy.done);
            document.getElementById('open').href = result.url;
            show('done');
            // Works where the sandbox allows it; the button is there if not.
            if (copy.redirect) {
              try { window.top.location.href = result.url; } catch (e) {}
            }
          })
          .withFailureHandler((err) => {
            document.getElementById('message').textContent = err.message || String(err);
            show('failed');
          })
          .runRowAction(action, rowId);
      }

      if (copy.ask) {
        setText('confirm-title', copy.ask);
        setText('confirm-text', copy.askText);
        setText('confirm-button', copy.confirm);
        document.getElementById('confirm-button').addEventListener('click', run);
        show('confirm');
      } else {
        run();
      }
    </script>
  </body>
</html>
