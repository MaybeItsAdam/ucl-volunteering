<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 48px 16px;
        background: #faf8f4;
        color: #444054;
        font: 16px/1.5 Arvo, Georgia, serif;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #e6e4ea;
        border-radius: 8px;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6e6b7c;
      }
      h1 { margin: 0 0 12px; font-size: 20px; }
      p { margin: 0 0 16px; }
      .button {
        display: inline-block;
        min-height: 44px;
        padding: 10px 16px;
        box-sizing: border-box;
        border-radius: 6px;
        background: #007fff;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .error { color: #d62246; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">VolSoc Master Plan</p>

      <div id="working">
        <h1 id="working-title"></h1>
        <p>Filling it in from the sheet. This takes a few seconds.</p>
      </div>

      <div id="done" hidden>
        <h1 id="done-title"></h1>
        <p id="done-text"></p>
        <a id="open" class="button" href="#"></a>
      </div>

      <div id="failed" hidden>
        <h1 id="failed-title"></h1>
        <p id="message" class="error"></p>
      </div>
    </main>

    <script>
      const rowId = <?= rowId ?>;
      const action = <?= action ?>;

      const copy = {
        doc: {
          working: 'Creating doc…',
          done: 'Doc created',
          existed: 'This row already has a doc',
          text: "It's linked in the Doc Detail cell for this row.",
          open: 'Open doc',
          failed: "Couldn't create the doc",
        },
        calendar: {
          working: 'Adding to calendar…',
          done: 'Added as provisional',
          existed: 'Already in the calendar',
          text: 'It\'s in the VolSoc calendar as "[Provisional] …" and follows the sheet. Clear the cell in the sheet to take it out.',
          open: 'Open event',
          failed: "Couldn't add it to the calendar",
        },
      }[action];

      const setText = (id, text) => (document.getElementById(id).textContent = text);
      setText('working-title', copy.working);
      setText('done-text', copy.text);
      setText('open', copy.open);
      setText('failed-title', copy.failed);

      function show(id) {
        ['working', 'done', 'failed'].forEach((section) => {
          document.getElementById(section).hidden = section !== id;
        });
      }

      google.script.run
        .withSuccessHandler((result) => {
          setText('done-title', result.existed ? copy.existed : copy.done);
          document.getElementById('open').href = result.url;
          show('done');
          // Works where the sandbox allows it; the button is there if not.
          try { window.top.location.href = result.url; } catch (e) {}
        })
        .withFailureHandler((err) => {
          document.getElementById('message').textContent = err.message || String(err);
          show('failed');
        })
        .runRowAction(action, rowId);
    </script>
  </body>
</html>
