name: iOS TestFlight

# Every push to main builds the iOS shell (a Capacitor shell around
# https://uclvolunteering.org) and uploads it to TestFlight for internal
# testers, after lint, typecheck and tests pass.
#
# Push runs stay off until the repo variable IOS_TESTFLIGHT_ENABLED is "true",
# so main doesn't go red before the Apple secrets exist. Dispatch always runs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = internal testers, release = App Store draft"
        type: choice
        options: [beta, release]
        default: beta

# One store upload at a time, and never cancel one halfway.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # Gate: nothing reaches testers unless main is green.
  test:
    name: Pre-deploy checks
    if: github.event_name == 'workflow_dispatch' || vars.IOS_TESTFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: iOS -> TestFlight ${{ inputs.lane || 'beta' }}
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load match-certs SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY }}

      - run: npm ci

      # Copies the web shell and plugins in and runs pod install.
      - name: Sync Capacitor iOS shell
        run: npx cap sync ios

      - name: Build & upload
        run: bundle exec fastlane ios ${{ inputs.lane || 'beta' }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
