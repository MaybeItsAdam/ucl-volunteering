# Deploys to the UCL Volunteering Society team's Vercel project. The repo lives
# on a GitHub account linked to a different Vercel account, so Vercel's own Git
# integration can't reach it; this does the same job with a team token.
#
# The source is uploaded and built on Vercel, not here: Vercel never hands its
# sensitive variables (database URL, service key) to a local `vercel build`, and
# the production build needs them to apply migrations.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_kRmbnWfR8GBLhXFs81vGf7um
  VERCEL_PROJECT_ID: prj_6F1dJzaP8WNiHapIqrMYg6kqwXsA

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    # Forks get no secrets; their PRs stop at the test job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A blocked deployment leaves the CLI waiting until the 6-hour job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deploy
        run: |
          prod=""
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then prod="--prod"; fi
          url=$(npx --yes vercel@latest deploy $prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
