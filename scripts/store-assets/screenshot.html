<!doctype html>
<!-- Store screenshot template: brand-colour background, League Spartan headline,
     a flat prussian device frame holding a real capture of the app. Filled in by
     scripts/store-screenshots.mjs; open it directly to preview the layout -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "League Spartan"; src: url("../../branding/fonts/LeagueSpartan[wght].ttf"); font-weight: 100 900; }
  @font-face { font-family: "Work Sans"; src: url("../../branding/fonts/WorkSans[wght].ttf"); font-weight: 100 900; }
  :root {
    --cyan: #10C4C0; --prussian: #061C33; --linen: #FEEFE5;
    --w: 440px; --h: 956px; --device-w: 0.80; --bezel: 11px; --radius: 44px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: var(--bg, var(--cyan)); color: var(--prussian);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--h) * 0.055) calc(var(--w) * 0.07) calc(var(--h) * 0.04);
    font-family: "Work Sans", sans-serif;
  }
  .eyebrow {
    font-weight: 600; font-size: calc(var(--w) * 0.03); letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: calc(var(--h) * 0.014);
  }
  h1 {
    font-family: "League Spartan", sans-serif; font-weight: 700;
    font-size: var(--headline, calc(var(--w) * 0.083)); line-height: 1.04; letter-spacing: -0.012em;
    text-align: center; text-wrap: balance; max-width: 100%;
    margin-bottom: calc(var(--h) * 0.035);
  }
  .device {
    flex: 1; min-height: 0; width: calc(var(--w) * var(--device-w));
    background: var(--prussian); border-radius: var(--radius); padding: var(--bezel);
    display: flex;
  }
  .screen {
    flex: 1; border-radius: calc(var(--radius) - var(--bezel)); overflow: hidden;
    background: var(--linen); position: relative;
  }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="eyebrow">UCL Volunteering Society</div>
  <h1 id="headline">Every Volunteering event at UCL, in one place</h1>
  <div class="device"><div class="screen" id="screen"><img id="capture" alt=""></div></div>
</body>
</html>
